<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NAVS=[['Dashboard','','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'],['Bulk Emails','','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'],['Single Email','single','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>'],['Verify Emails','verify','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'],['Failures','','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'],['Settings','','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>']];
let mode='open';const sb=$('.sbi');
function setMode(m){mode=m;document.documentElement.dataset.mode=m;$('#tog').setAttribute('aria-expanded',m==='open');$('#togl').textContent=m==='open'?'Collapse sidebar':'Keep sidebar open'}
$('#tog').onclick=()=>{if(mode==='open'){setMode('rail');sb.setAttribute('data-hold','')}else{setMode('open');sb.removeAttribute('data-hold')}};
sb.addEventListener('mouseleave',()=>sb.removeAttribute('data-hold'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function ask(title,text,ok,fn){$('#dt').textContent=title;$('#dp').textContent=text;$('#dok').textContent=ok;$('#dlg').classList.add('on');$('#scrim').classList.add('on');$('#dok').onclick=()=>{closeDlg();fn()};$('#dc').onclick=closeDlg}
function closeDlg(){$('#dlg').classList.remove('on');$('#scrim').classList.remove('on')}
$('#scrim').onclick=closeDlg;addEventListener('keydown',e=>{if(e.key==='Escape')closeDlg()});
/* data */
const PROBLEMS=[{row:3,name:'Ben Carter',email:'',reason:'email is empty',type:'invalid'},{row:9,name:'Mehedi Hasan',email:'mehedi@@bad.example',reason:'invalid email "mehedi@@bad.example"',type:'invalid'},{row:14,name:'Joy Das',email:'joy.das(at)shop.example',reason:'invalid email "joy.das(at)shop.example"',type:'invalid'},{row:21,name:'Tania Islam',email:'tania@',reason:'invalid email "tania@"',type:'invalid'},{row:27,name:'Rafi Khan',email:'',reason:'email is empty',type:'invalid'},{row:33,name:'Sumi Akter',email:'sumi akter@shop.example',reason:'invalid email "sumi akter@shop.example"',type:'invalid'},{row:48,name:'Nabil Haque',email:'nabil@@mart.example',reason:'invalid email "nabil@@mart.example"',type:'invalid'},{row:52,name:'',email:'',reason:'email is empty',type:'invalid'},{row:61,name:'Orin Sheikh',email:'orin@shop',reason:'invalid email "orin@shop"',type:'invalid'},{row:77,name:'Aisha Rahman',email:'aisha@fastmart.example',reason:'duplicate email "aisha@fastmart.example"',type:'duplicate'},{row:130,name:'Imran Hossain',email:'imran@greenleaf.example',reason:'duplicate email "imran@greenleaf.example"',type:'duplicate'},{row:144,name:'Kabir Ali',email:'kabir@no-such-domain-xyz.example',reason:'domain no-such-domain-xyz.example does not exist or has no mail server',type:'domain'},{row:201,name:'Dola Roy',email:'dola@typo-gmial.example',reason:'domain typo-gmial.example does not exist or has no mail server',type:'domain'},{row:233,name:'Salma Begum',email:'salma@',reason:'invalid email "salma@"',type:'invalid'},{row:260,name:'Hasan Mahmud',email:'',reason:'email is empty',type:'invalid'},{row:289,name:'Poly Sarker',email:'poly@@shop.example',reason:'invalid email "poly@@shop.example"',type:'invalid'}];
const UNV=[{row:88,name:'Lina Paul',email:'lina@slowdns.example',reason:'could not verify domain slowdns.example: lookup timed out'},{row:150,name:'Sohel Rana',email:'sohel@slowdns.example',reason:'could not verify domain slowdns.example: lookup timed out'},{row:212,name:'Mim Akter',email:'mim@slowdns.example',reason:'could not verify domain slowdns.example: lookup timed out'}];
const VALID=296,SKIP=16,TOTAL=312,FROM='mahin@test.com';
/* state */
let view='verify';
const O={vl:'A',sl:'A',cont:true,csv:false,confirm:true,after:'banner',me:true};
let V={phase:'empty',file:null,err:'',tab:'all'};
let S={to:'',subject:'',body:'',touched:false,sending:false,result:null};
function nav(){$('#nav').innerHTML=NAVS.map(([n,v,i])=>`<a href="#" data-v="${v}" class="${(v==='verify'&&view==='verify')||(v==='single'&&view==='single')?'on':''}" aria-label="${n}">${i}<span>${n}</span></a>`).join('');$$('#nav a').forEach(a=>a.onclick=e=>{e.preventDefault();if(a.dataset.v){view=a.dataset.v;render()}})}
function dock(){const b=(grp,val,label,cur)=>`<button data-o="${grp}" data-val="${val}" aria-pressed="${cur===val}">${label}</button>`;const t=(k,l)=>`<button data-t="${k}" aria-pressed="${O[k]}">${l}: ${O[k]?'on':'off'}</button>`;
 $('#dock').innerHTML=view==='verify'?`<div class="g"><span>Verify layout</span>${b('vl','A','A · Stacked',O.vl)}${b('vl','B','B · Two columns',O.vl)}${b('vl','C','C · One card',O.vl)}</div><div class="g"><span>Extras</span>${t('cont','Continue to New Bulk Email')}${t('csv','Download problems')}</div><div class="g"><button id="rst">Start over</button></div>`:`<div class="g"><span>Single layout</span>${b('sl','A','A · Simple form',O.sl)}${b('sl','B','B · Form + preview',O.sl)}${b('sl','C','C · Mail window',O.sl)}</div><div class="g"><span>Behaviour</span>${t('confirm','Confirm before sending')}${t('me','"Send to myself" shortcut')}${b('after','banner','After send: banner',O.after)}${b('after','clear','After send: clear + toast',O.after)}</div><div class="g"><button id="rst">Start over</button></div>`;
 $$('[data-o]').forEach(x=>x.onclick=()=>{O[x.dataset.o]=x.dataset.val;render()});$$('[data-t]').forEach(x=>x.onclick=()=>{O[x.dataset.t]=!O[x.dataset.t];render()});$('#rst').onclick=()=>{V={phase:'empty',file:null,err:'',tab:'all'};S={to:'',subject:'',body:'',touched:false,sending:false,result:null};render()}}
/* ---------- Verify ---------- */
function upload(){
 if(V.phase==='empty')return `${V.err?`<div class="notice err">${esc(V.err)}</div>`:''}<div class="drop"><b>Drop your .xlsx file here</b><p>First sheet, with a header row that has Name and Email. Up to 10 MB. Nothing is sent or saved.</p><div class="row"><button class="sec" id="pick">Choose file</button><button class="ghost" id="sample">Use the demo file</button></div></div><input type="file" id="fi" accept=".xlsx" hidden>`;
 return `<div class="file"><div class="ic">XLSX</div><div><b>${esc(V.file.name)}</b><small>${V.file.size}</small></div>${V.phase==='checking'?'':'<button class="x" id="rm">Remove</button>'}</div>${V.phase==='checking'?'<div class="notice" style="background:#F5F4F0"><span class="spin"></span>Checking every row. Nothing is sent.</div>':''}`}
function tabs(){const c=t=>PROBLEMS.filter(r=>r.type===t).length;return `<div class="tabs" id="rtabs">${[['all','All problems',SKIP],['invalid','Invalid',c('invalid')],['duplicate','Duplicate',c('duplicate')],['domain','Bad domain',c('domain')],['unv','Unverified',UNV.length]].map(([v,l,n])=>`<button data-t2="${v}" class="${V.tab===v?'on':''}">${l}<span>${n}</span></button>`).join('')}</div>`}
function table(max){const rows=V.tab==='unv'?UNV:V.tab==='all'?PROBLEMS:PROBLEMS.filter(r=>r.type===V.tab);return `<div style="overflow:auto;max-height:${max}px;margin-top:12px"><table><thead><tr><th>Row</th><th>Name</th><th>Email</th><th>Reason</th></tr></thead><tbody>${rows.map(r=>`<tr><td style="color:var(--mu)">${r.row}</td><td style="font-weight:600">${esc(r.name||'(empty)')}</td><td style="word-break:break-all">${esc(r.email||'(empty)')}</td><td style="color:${V.tab==='unv'?'#8A5A00':'#C62E33'};font-size:13px">${esc(r.reason)}</td></tr>`).join('')}</tbody></table></div>`}
function tiles(cls){return `<div class="${cls}" style="display:${cls==='tiles3'?'grid':'flex'}"><div class="k" style="background:#161616;color:#fff"><small style="color:#d9d7d0">Ready to send</small><strong>${VALID}</strong><em style="color:#d9d7d0">valid emails</em></div><div class="k" style="background:#F5F4F0"><small>Will be skipped</small><strong style="color:var(--bad)">${SKIP}</strong><em>invalid, duplicate or bad domain</em></div><div class="k" style="background:#F5F4F0"><small>Could not verify</small><strong>${UNV.length}</strong><em>still sent if you use this file</em></div></div>`}
function actions(){return `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #EFEEEA"><button class="ghost" id="again">Check another file</button>${O.csv?'<button class="ghost" id="csv">Download problems (CSV)</button>':''}${O.cont?'<button class="sec" id="cont" style="margin-left:auto">Continue to New Bulk Email</button>':''}</div>`}
const notice=()=>`<div class="notice warn"><b>${SKIP} rows have problems.</b> They would be skipped if you used this file. Fix them in the spreadsheet and check it again.</div>`;
function verify(){
 const r=V.phase==='ready';let h=`<div class="hd"><div><h1>Verify Emails</h1><p>Check a spreadsheet before you use it. Nothing is sent.</p></div></div>`;
 if(O.vl==='A')h+=`<div class="stack"><section class="card"><h2>Upload your spreadsheet</h2><p class="sub">We check every row and tell you what is wrong.</p>${upload()}</section>${r?`<section class="card"><h2>Result</h2><p class="sub">${TOTAL} rows checked.</p><div class="bento">${tiles('tiles3')}</div>${notice()}${tabs()}${table(340)}${actions()}</section>`:''}</div>`;
 else if(O.vl==='B')h+=`<div class="two"><section class="card"><h2>Upload</h2><p class="sub">Drop a file to check it.</p>${upload()}${r?`<div class="bento" style="margin-top:14px">${tiles('tiles1')}</div>`:''}${r?actions().replace('margin-top:16px','margin-top:14px'):''}</section><section class="card"><h2>Problems</h2><p class="sub">${r?`${TOTAL} rows checked. ${SKIP} rows have problems.`:'Upload a file to see what is wrong with it.'}</p>${r?tabs()+table(430):'<div style="color:#A3A19A;padding:40px 0;text-align:center">Nothing to show yet</div>'}</section></div>`;
 else h+=`<section class="card"><h2>${r?esc(V.file.name):'Check a spreadsheet'}</h2><p class="sub">${r?`${TOTAL} rows checked.`:'Drop a file and the result appears here.'}</p>${r?`<div class="chipline"><span class="cp d"><b>${VALID}</b>ready</span><span class="cp r"><b>${SKIP}</b>skipped</span><span class="cp"><b>${UNV.length}</b>unverified</span></div>${notice()}${tabs()}${table(380)}${actions()}`:upload()}</section>`;
 return h}
function bindVerify(){
 const p=$('#pick');if(p){const fi=$('#fi');p.onclick=()=>fi.click();fi.onchange=()=>{const f=fi.files[0];if(f)take(f.name,(f.size/1024).toFixed(0)+' KB',f.size)};$('#sample').onclick=()=>take('orders_oct28.xlsx','48 KB',48000)}
 const rm=$('#rm');if(rm)rm.onclick=()=>{V={phase:'empty',file:null,err:'',tab:'all'};render()};
 $$('[data-t2]').forEach(b=>b.onclick=()=>{V.tab=b.dataset.t2;render()});
 const ag=$('#again');if(ag)ag.onclick=()=>{V={phase:'empty',file:null,err:'',tab:'all'};render()};
 const cv=$('#csv');if(cv)cv.onclick=()=>toast('Preview only: a CSV of the 16 problem rows would download');
 const ct=$('#cont');if(ct)ct.onclick=()=>toast('Preview only: opens New Bulk Email with this file already checked')}
function take(name,size,bytes){V.err='';if(!/\.xlsx$/i.test(name)){V.err='Only .xlsx files are supported.';render();return}if(bytes>10*1048576){V.err='The file is too large. The limit is 10 MB.';render();return}V={phase:'checking',file:{name,size},err:'',tab:'all'};render();setTimeout(()=>{V.phase='ready';render()},1300)}
/* ---------- Single ---------- */
const okTo=v=>/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(v.trim());
function errs(){return{to:!S.to.trim()?'Enter the recipient\'s email address.':!okTo(S.to)?'That does not look like an email address.':'',subject:!S.subject.trim()?'Write a subject.':'',body:!S.body.trim()?'Write a message.':''}}
const valid=()=>{const e=errs();return !e.to&&!e.subject&&!e.body};
function previewBox(){return `<div class="mail"><div class="lbl">Preview. Sent as plain text.</div><div class="to">To: ${S.to?esc(S.to):'<span class="empty">recipient</span>'}</div><div class="subj">${S.subject?esc(S.subject):'<span class="empty">Subject</span>'}</div><div class="msg">${S.body?esc(S.body):'<span class="empty">Your message will appear here.</span>'}</div></div>`}
function fields(cls){const e=errs(),sh=S.touched;
 return `<div class="fld"><label for="to">To</label><input class="inp ${sh&&e.to?'bad':''}" id="to" type="email" value="${esc(S.to)}" placeholder="name@example.com">${O.me?`<button class="lnk" id="me" style="margin:6px 0 0">Send to myself (${FROM})</button>`:''}${sh&&e.to?`<div class="ferr">${e.to}</div>`:''}</div>
 <div class="fld"><label for="subject">Subject</label><input class="inp ${sh&&e.subject?'bad':''}" id="subject" value="${esc(S.subject)}">${sh&&e.subject?`<div class="ferr">${e.subject}</div>`:''}</div>
 <div class="fld"><label for="body">Message</label><textarea class="ta ${sh&&e.body?'bad':''}" id="body">${esc(S.body)}</textarea>${sh&&e.body?`<div class="ferr">${e.body}</div>`:''}<p style="color:var(--mu);font-size:12.5px;margin-top:8px">Plain text. Fields like {{.Name}} only work in Bulk Emails.</p></div>`}
function resultBox(){if(!S.result)return '';return S.result.ok?`<div class="okbox" role="status" style="margin-bottom:14px"><b>Email sent</b>Sent to ${esc(S.result.to)}. <button class="lnk" id="another" style="margin-left:6px">Send another</button></div>`:`<div class="notice err" role="alert"><b>Could not send.</b> ${esc(S.result.msg)}</div>`}
function sendBtn(){return `<button class="sec" id="send" ${S.sending?'disabled':''}>${S.sending?'<span class="spin" style="border-color:#777;border-top-color:#fff"></span>Sending…':'Send email'}</button>`}
function single(){
 let h=`<div class="hd"><div><h1>Single Email</h1><p>Send one email right now. It is sent immediately, not queued.</p></div></div>`;
 const banner=O.after==='banner'?resultBox():(S.result&&!S.result.ok?resultBox():'');
 if(O.sl==='A')h+=`<section class="card" style="max-width:680px">${banner}${fields()}<div style="display:flex;justify-content:flex-end">${sendBtn()}</div></section>`;
 else if(O.sl==='B')h+=`<div class="twof"><section class="card">${banner}${fields()}<div style="display:flex;justify-content:flex-end">${sendBtn()}</div></section><div style="position:sticky;top:14px">${previewBox()}</div></div>`;
 else{const e=errs(),sh=S.touched;h+=`<div style="max-width:760px">${banner}<div class="win"><div class="wbar"><span>New message</span><span style="opacity:.7;font-weight:500">from ${FROM}</span></div><div class="line"><label for="to">To</label><input id="to" type="email" value="${esc(S.to)}" placeholder="name@example.com">${O.me?'<button class="lnk" id="me">myself</button>':''}</div>${sh&&e.to?`<div class="ferr" style="padding:6px 22px">${e.to}</div>`:''}<div class="line"><label for="subject">Subject</label><input id="subject" value="${esc(S.subject)}"></div>${sh&&e.subject?`<div class="ferr" style="padding:6px 22px">${e.subject}</div>`:''}<textarea id="body" placeholder="Write your message…">${esc(S.body)}</textarea>${sh&&e.body?`<div class="ferr" style="padding:0 22px 10px">${e.body}</div>`:''}<div class="foot"><span style="color:var(--mu);font-size:12.5px">Plain text · sent immediately</span>${sendBtn()}</div></div></div>`}
 return h}
function bindSingle(){
 ['to','subject','body'].forEach(k=>{const el=$('#'+k);if(el)el.oninput=()=>{S[k]=el.value;if(S.result&&S.result.ok&&O.after==='banner')S.result=null;const pv=$('.mail');if(pv&&O.sl==='B'){const t=pv.querySelector('.to'),s=pv.querySelector('.subj'),m=pv.querySelector('.msg');t.innerHTML='To: '+(S.to?esc(S.to):'<span class="empty">recipient</span>');s.innerHTML=S.subject?esc(S.subject):'<span class="empty">Subject</span>';m.innerHTML=S.body?esc(S.body):'<span class="empty">Your message will appear here.</span>'}}});
 const me=$('#me');if(me)me.onclick=e=>{e.preventDefault();S.to=FROM;keep(render)};
 const sd=$('#send');if(sd)sd.onclick=()=>{S.touched=true;S.result=null;if(!valid()){keep(render);const first=$('.bad')||$('.ferr');first&&first.scrollIntoView({block:'center'});return}
  const go=()=>{S.sending=true;keep(render);setTimeout(()=>{S.sending=false;if(/fail/i.test(S.to)){S.result={ok:false,msg:'The mail server refused the recipient: 550 mailbox unavailable. Nothing was sent.'}}else{S.result={ok:true,to:S.to};if(O.after==='clear'){S.to='';S.subject='';S.body='';S.touched=false;S.result=null;toast('Email sent')}}keep(render)},1100)};
  if(O.confirm)ask('Send this email now?','It will be sent to '+S.to+' immediately. This cannot be undone.','Send email',go);else go()};
 const an=$('#another');if(an)an.onclick=e=>{e.preventDefault();S={to:'',subject:'',body:'',touched:false,sending:false,result:null};render()}}
function keep(fn){const y=scrollY;fn();scrollTo(0,y)}
function render(){nav();dock();const m=$('#main');if(view==='verify'){m.innerHTML=verify();bindVerify()}else{m.innerHTML=single();bindSingle()}}
setMode('open');render();
</script></body></html>
