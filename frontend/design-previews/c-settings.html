<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const NAVS=[['Dashboard','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>'],['Bulk Emails','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>'],['Single Email','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>'],['Verify Emails','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>'],['Failures','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>'],['Settings','<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>']];
$('#nav').innerHTML=NAVS.map(([n,i])=>`<a href="#" class="${n==='Settings'?'on':''}" aria-label="${n}">${i}<span>${n}</span></a>`).join('');
$$('#nav a').forEach(a=>a.onclick=e=>e.preventDefault());
let mode='open';const sb=$('.sbi');
function setMode(m){mode=m;document.documentElement.dataset.mode=m;$('#tog').setAttribute('aria-expanded',m==='open');$('#togl').textContent=m==='open'?'Collapse sidebar':'Keep sidebar open'}
$('#tog').onclick=()=>{if(mode==='open'){setMode('rail');sb.setAttribute('data-hold','')}else{setMode('open');sb.removeAttribute('data-hold')}};
sb.addEventListener('mouseleave',()=>sb.removeAttribute('data-hold'));
/* data, shaped like GET /settings */
const GROUPS=[
 {id:'smtp',title:'Sender and SMTP',sub:'Where email is sent from. Saving connects to the server first and refuses the change if that fails.',keys:['MAIL_FROM','SMTP_HOST','SMTP_PORT','SMTP_TLS_MODE','SMTP_USERNAME','SMTP_PASSWORD']},
 {id:'send',title:'Sending behaviour',sub:'How recipients are checked and how often delivery is attempted.',keys:['DOMAIN_CHECK_ENABLED','MAX_JOB_RETRIES']},
 {id:'srv',title:'Server limits',sub:'Saved now, used the next time the server starts.',keys:['WORKER_COUNT','SMTP_POOL_SIZE','JOB_POLL_INTERVAL']},
 {id:'ro',title:'Read-only',sub:'Shown for reference. These can only be changed in the server environment.',keys:['HTTP_ADDR','HTTP_READ_TIMEOUT','HTTP_WRITE_TIMEOUT']}];
const DEF={
 MAIL_FROM:{d:'Sender address on every outgoing email',kind:'string',value:'MailFlow <noreply@shop.example>',src:'env',apply:'instant',env:'MailFlow <noreply@shop.example>'},
 SMTP_HOST:{d:'SMTP server hostname',kind:'string',value:'smtp.mailprovider.example',src:'override',apply:'instant',env:'localhost'},
 SMTP_PORT:{d:'SMTP server port (587 for STARTTLS, 465 for implicit TLS, 1025 for Mailpit)',kind:'int',value:'587',src:'override',apply:'instant',env:'1025'},
 SMTP_TLS_MODE:{d:'Encryption to the SMTP server',kind:'enum',options:['auto','none','starttls','tls'],value:'starttls',src:'override',apply:'instant',env:'auto'},
 SMTP_USERNAME:{d:'SMTP login (leave empty for servers without authentication)',kind:'string',value:'apikey',src:'override',apply:'instant',env:''},
 SMTP_PASSWORD:{d:'SMTP password (write-only: never shown again after saving)',kind:'secret',value:'',has:true,src:'override',apply:'instant',env:''},
 DOMAIN_CHECK_ENABLED:{d:'Reject recipients whose domain has no mail server (DNS/MX check)',kind:'bool',value:'true',src:'env',apply:'instant',env:'true'},
 MAX_JOB_RETRIES:{d:'Delivery attempts per email before it is marked failed (applies to new uploads)',kind:'int',value:'3',src:'env',apply:'instant',env:'3'},
 WORKER_COUNT:{d:'Background workers sending emails in parallel',kind:'int',value:'3',src:'env',apply:'restart',env:'3'},
 SMTP_POOL_SIZE:{d:'Maximum simultaneous SMTP connections',kind:'int',value:'3',src:'env',apply:'restart',env:'3'},
 JOB_POLL_INTERVAL:{d:'How often idle workers check for new jobs (e.g. 500ms)',kind:'duration',value:'500ms',src:'env',apply:'restart',env:'500ms'},
 HTTP_ADDR:{d:'Address the API listens on (changing it would cut off this page)',kind:'string',value:':8080',src:'env',apply:'readonly'},
 HTTP_READ_TIMEOUT:{d:'Maximum time to read a request, including uploads',kind:'duration',value:'30s',src:'env',apply:'readonly'},
 HTTP_WRITE_TIMEOUT:{d:'Maximum time a request may take before its response is written',kind:'duration',value:'30s',src:'env',apply:'readonly'}};
let S,layout='A',tab='smtp';
function fresh(){S={};for(const k in DEF){S[k]={...DEF[k],orig:DEF[k].value,origSrc:DEF[k].src,pw:null,rmPw:false}};S.restartNote=false;S.test={state:'idle',msg:''}}
fresh();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
/* validation like the Go catalog */
function validate(k,v){
 if(k==='MAIL_FROM'&&!/^[^<>\s@][^<>@]*(<[^<>\s@]+@[^<>\s@]+>)?$|^[^\s@]+@[^\s@]+$/.test(v.trim())&&!/<[^<>\s@]+@[^<>\s@]+>/.test(v))return 'Enter an address like name@example.com or Name <name@example.com>.';
 if(k==='SMTP_HOST'&&!v.trim())return 'SMTP_HOST is required.';
 if(k==='SMTP_PORT'){const n=+v;if(!Number.isInteger(n)||n<1||n>65535)return 'Port must be a whole number from 1 to 65535.'}
 if(k==='MAX_JOB_RETRIES'){const n=+v;if(!Number.isInteger(n)||n<1||n>20)return 'Use a whole number from 1 to 20.'}
 if(k==='WORKER_COUNT'||k==='SMTP_POOL_SIZE'){const n=+v;if(!Number.isInteger(n)||n<1||n>100)return 'Use a whole number from 1 to 100.'}
 if(k==='JOB_POLL_INTERVAL'&&!/^\d+(ms|s|m)$/.test(v))return 'Use a duration like 500ms or 2s (between 50ms and 1m).';
 return ''}
const isDirty=k=>{const s=S[k];return s.apply!=='readonly'&&(s.value!==s.orig||(s.kind==='secret'&&(s.pw!==null||s.rmPw)))};
const dirtyIn=g=>g.keys.filter(isDirty);
function field(k){
 const s=S[k];let ctl='';
 if(s.apply==='readonly')ctl=`<input class="inp" readonly value="${esc(s.value)}" aria-label="${k}">`;
 else if(s.kind==='bool')ctl=`<button class="sw" role="switch" aria-checked="${s.value==='true'}" data-k="${k}" aria-label="${k}"></button> <span style="margin-left:8px;font-size:14px">${s.value==='true'?'On':'Off'}</span>`;
 else if(s.kind==='enum')ctl=`<select class="inp" data-k="${k}" aria-label="${k}">${s.options.map(o=>`<option ${o===s.value?'selected':''}>${o}</option>`).join('')}</select>`;
 else if(s.kind==='secret'){
  if(s.pw!==null)ctl=`<div class="pwline"><input class="inp" type="password" data-k="${k}" data-pw placeholder="New password" aria-label="${k}" autocomplete="new-password" value="${esc(s.pw)}"><button class="lnk" data-cancelpw="${k}">Cancel</button></div>`;
  else if(s.rmPw)ctl=`<div class="pwline"><span>Password will be removed when you save.</span><button class="lnk" data-undo="${k}">Undo</button></div>`;
  else ctl=`<div class="pwline"><span class="mtag ${s.has?'ok':''}">${s.has?'Password is set':'No password'}</span><button class="ghost" data-chpw="${k}">${s.has?'Change password':'Set password'}</button>${s.has?`<button class="lnk" data-rmpw="${k}">Remove</button>`:''}</div>`}
 else ctl=`<input class="inp" data-k="${k}" value="${esc(s.value)}" aria-label="${k}" ${s.kind==='int'?'inputmode="numeric"':''}>`;
 const tags=[];
 if(s.apply==='restart')tags.push('<span class="mtag warn">Needs a restart</span>');else if(s.apply==='instant')tags.push('<span class="mtag">Applies instantly</span>');else tags.push('<span class="mtag">Read-only</span>');
 tags.push(`<span class="mtag ${s.src==='override'?'ok':''}">${s.src==='override'?'Changed here':'From environment'}</span>`);
 const reset=(s.src==='override'&&s.apply!=='readonly')?`<button class="lnk" data-reset="${k}" style="margin-left:0;margin-top:6px">Reset to default</button>`:'';
 return `<div class="row" data-row="${k}"><div class="lab"><b>${k}</b><small>${esc(s.d)}</small><div class="mtags">${tags.join('')}</div>${reset}</div><div>${ctl}<div class="err" data-err="${k}"></div></div></div>`}
function testBox(){
 const t=S.test;return `<div class="testbox"><b style="font-size:14px">Send a test email</b><p style="margin:2px 0 10px;color:var(--mu)">Uses the values above, even if they are not saved yet.</p><div class="line"><input class="inp" id="testto" value="you@shop.example" aria-label="Send test to"><button class="ghost" id="testbtn" ${t.state==='sending'?'disabled':''}>${t.state==='sending'?'<span class="spin"></span>Sending…':'Send test email'}</button></div>${t.state==='ok'?`<p style="color:#0E4F35"><b>✓</b> ${esc(t.msg)}</p>`:t.state==='err'?`<p style="color:#C62E33" role="alert"><b>✕</b> ${esc(t.msg)}</p>`:''}</div>`}
function group(g,saveMode){
 const rows=g.keys.map(field).join('');
 const foot=saveMode==='group'&&g.id!=='ro'?`<div class="cardfoot"><button class="ghost" data-discard="${g.id}" disabled>Discard</button><button class="sec" data-save="${g.id}" disabled>${g.id==='smtp'?'Test connection and save':'Save changes'}</button></div>`:'';
 const note=(g.id==='srv'&&S.restartNote)?`<div class="notice warn" style="margin-top:14px"><b>Saved. Restart the server to apply.</b> The new values are stored and will be used the next time it starts.</div>`:'';
 return `<section class="card" data-g="${g.id}"><h2>${g.title}<span class="dirty">Unsaved changes</span></h2><p class="sub">${g.sub}</p>${rows}${g.id==='smtp'?testBox():''}${note}${foot}</section>`}
function banner(){return `<div class="notice warn"><b>There is no login yet.</b> Anyone who can reach this API can change where email is sent from and the SMTP password. Keep it on a private network until sign-in exists.</div>`}
function render(){
 const m=$('#main');let h=`<div class="hd"><div><h1>Settings</h1><p>Sender, SMTP and sending behaviour</p></div></div>`+banner();
 if(layout==='A')h+=`<div class="grid2s">${GROUPS.map((g,i)=>group(g,'group').replace('<section class="card"',`<section class="card ${i===0?'wide':''}"`)).join('')}</div>`;
 else if(layout==='B')h+=`<div class="stack">${GROUPS.map(g=>group(g,'page')).join('')}</div><div class="sticky"><span id="stickyTxt">No unsaved changes</span><span style="display:flex;gap:8px"><button class="ghost" id="discardAll" disabled>Discard all</button><button class="sec" id="saveAll" disabled>Save all changes</button></span></div>`;
 else h+=`<div class="tabs" role="tablist">${GROUPS.map(g=>`<button data-tab="${g.id}" class="${tab===g.id?'on':''}" role="tab" aria-selected="${tab===g.id}">${g.title}<i data-tdot="${g.id}" style="display:none"></i></button>`).join('')}</div>`+group(GROUPS.find(g=>g.id===tab),'group');
 m.innerHTML=h;bind();updDirty();$$('[data-l]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===layout))}
function updDirty(){
 let total=0;
 GROUPS.forEach(g=>{const d=dirtyIn(g).length;total+=d;const card=$(`[data-g="${g.id}"]`);if(card){card.classList.toggle('isdirty',d>0);const sv=card.querySelector('[data-save]'),ds=card.querySelector('[data-discard]');if(sv)sv.disabled=d===0;if(ds)ds.disabled=d===0}const dot=$(`[data-tdot="${g.id}"]`);if(dot)dot.style.display=d?'inline-block':'none'});
 const st=$('#stickyTxt');if(st){st.innerHTML=total?`<b>${total}</b> unsaved ${total===1?'change':'changes'}`:'No unsaved changes';$('#saveAll').disabled=!total;$('#discardAll').disabled=!total}}
function showErr(k,msg){const r=$(`[data-row="${k}"]`);if(!r)return;r.classList.toggle('hasErr',!!msg);const e=r.querySelector('[data-err]');if(e)e.textContent=msg;const i=r.querySelector('.inp');if(i)i.classList.toggle('bad',!!msg)}
function bind(){
 $$('[data-k]').forEach(el=>{
  if(el.classList.contains('sw'))el.onclick=()=>{const k=el.dataset.k;S[k].value=S[k].value==='true'?'false':'true';keep(render)};
  else el.oninput=el.onchange=()=>{const k=el.dataset.k;if(el.hasAttribute('data-pw'))S[k].pw=el.value;else S[k].value=el.value;showErr(k,'');updDirty()}});
 $$('[data-chpw]').forEach(b=>b.onclick=()=>{S[b.dataset.chpw].pw='';keep(render)});
 $$('[data-cancelpw]').forEach(b=>b.onclick=()=>{S[b.dataset.cancelpw].pw=null;keep(render)});
 $$('[data-rmpw]').forEach(b=>b.onclick=()=>{S[b.dataset.rmpw].rmPw=true;keep(render)});
 $$('[data-undo]').forEach(b=>b.onclick=()=>{S[b.dataset.undo].rmPw=false;keep(render)});
 $$('[data-reset]').forEach(b=>b.onclick=()=>{const k=b.dataset.reset,s=S[k];s.value=s.env;s.src='env';s.orig=s.env;if(s.kind==='secret'){s.has=false;s.pw=null;s.rmPw=false}toast(k+' reset to its default');keep(render)});
 $$('[data-save]').forEach(b=>b.onclick=()=>save(GROUPS.filter(g=>g.id===b.dataset.save)));
 $$('[data-discard]').forEach(b=>b.onclick=()=>discard(GROUPS.filter(g=>g.id===b.dataset.discard)));
 const sa=$('#saveAll');if(sa)sa.onclick=()=>save(GROUPS.filter(g=>g.id!=='ro'));const da=$('#discardAll');if(da)da.onclick=()=>discard(GROUPS);
 $$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
 const tb=$('#testbtn');if(tb)tb.onclick=sendTest}
function keep(fn){const y=scrollY;fn();scrollTo(0,y)}
function discard(gs){gs.forEach(g=>g.keys.forEach(k=>{const s=S[k];s.value=s.orig;s.pw=null;s.rmPw=false}));keep(render)}
function smtpBad(){return /fail/i.test(S.SMTP_HOST.value)}
function save(gs){
 let bad=false;
 gs.forEach(g=>g.keys.forEach(k=>{if(isDirty(k)&&S[k].apply!=='readonly'&&S[k].kind!=='secret'&&S[k].kind!=='bool'&&S[k].kind!=='enum'){const e=validate(k,S[k].value);showErr(k,e);if(e)bad=true}}));
 if(bad){toast('Fix the highlighted fields first');return}
 const touchesSmtp=gs.some(g=>g.id==='smtp'&&dirtyIn(g).length);
 const apply=()=>{gs.forEach(g=>g.keys.forEach(k=>{if(!isDirty(k))return;const s=S[k];if(s.kind==='secret'){if(s.rmPw){s.has=false;s.rmPw=false;s.pw=null}else if(s.pw){s.has=true;s.pw=null}}s.orig=s.value;if(s.value!==s.env||s.kind==='secret'&&s.has)s.src='override';else s.src='env';if(s.apply==='restart')S.restartNote=true}));toast('Settings saved');keep(render)};
 if(touchesSmtp){toast('Connecting to the SMTP server…');setTimeout(()=>{if(smtpBad()){showErr('SMTP_HOST','SMTP connection failed: dial tcp: lookup '+S.SMTP_HOST.value+': no such host. Nothing was saved.')}else apply()},900)}else apply()}
function sendTest(){S.test={state:'sending',msg:''};keep(render);const to=$('#testto')?.value;setTimeout(()=>{S.test=smtpBad()?{state:'err',msg:'502: could not connect to '+S.SMTP_HOST.value+' ('+'connection refused'+'). No email was sent.'}:{state:'ok',msg:'Test email sent to '+(to||'you@shop.example')+'. Check the inbox.'};keep(render)},1000)}
$$('[data-l]').forEach(b=>b.onclick=()=>{layout=b.dataset.l;render()});
$('#reset').onclick=()=>{fresh();render()};
setMode('open');render();
</script></body></html>
