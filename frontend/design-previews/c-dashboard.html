let mode='open';const sb=$('.sbi');
function setMode(m){mode=m;document.documentElement.dataset.mode=m;$('#tog').setAttribute('aria-expanded',m==='open');$('#togl').textContent=m==='open'?'Collapse sidebar':'Keep sidebar open'}
$('#tog').onclick=()=>{if(mode==='open'){setMode('rail');sb.setAttribute('data-hold','')}else{setMode('open');sb.removeAttribute('data-hold')}};
sb.addEventListener('mouseleave',()=>sb.removeAttribute('data-hold'));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,2400)}
/* ---------- mock data, shaped like GET /stats and GET /batches ---------- */
const SENT30=[210,380,420,0,0,512,640,455,380,720,690,0,210,1050,300,410,0,0,560,610,480,520,700,650,0,180,900,830,760,1243];
const FAIL30=[2,6,9,0,0,11,15,6,3,18,12,0,3,26,4,7,0,0,8,12,5,9,14,10,0,2,21,16,11,79];
const NOW=new Date('2026-11-02T12:00:00+06:00');
const DAYS=SENT30.map((s,i)=>{const d=new Date(NOW);d.setDate(d.getDate()-(29-i));return{date:d,sent:s,failed:FAIL30[i]}});
const ATTN=[{id:42,filename:'refunds_oct27.xlsx',failed:12,invalid:0,reason:'failed_jobs',total:312},{id:39,filename:'returns_oct26.xlsx',failed:64,invalid:0,reason:'failed_jobs',total:64},{id:36,filename:'stock_alerts.xlsx',failed:3,invalid:41,reason:'high_invalid_rate',total:98}];
const RECENT=[['orders_oct28.xlsx',45,'Completed',1000,1000,0,'12 min ago'],['payouts_nov.xlsx',44,'Completed',610,610,0,'3 h ago'],['refunds_oct27.xlsx',42,'Completed with failures',300,312,12,'Yesterday'],['slots_oct.xlsx',41,'Completed',148,148,0,'Yesterday'],['returns_oct26.xlsx',39,'Completed with failures',0,64,64,'2 days ago'],['orders_bn.xlsx',38,'Completed',120,120,0,'2 days ago'],['commission_oct.xlsx',37,'Completed',230,230,0,'3 days ago'],['stock_alerts.xlsx',36,'Completed with failures',57,98,3,'3 days ago']];
const BADGE=(t,c,g)=>`<span class="b b-${c}"><i>${g}</i>${t}</span>`;
const ST={Completed:BADGE('Completed','done','✓'),'Completed with failures':BADGE('Completed with failures','warn','!'),Processing:BADGE('Processing','run','↻')};
/* ---------- state ---------- */
const O={layout:'A',chart:'stacked',range:14,ranges:true,kpi:4,actions:true,rows:5,state:'normal',table:false};
function data(){
 const st=O.state;
 if(st==='empty')return{today:{sent:0,failed:0},queue:{pending:0,retrying:0,processing:0},failedTotal:0,active:0,days:DAYS.map(d=>({...d,sent:0,failed:0})),attn:[],recent:[],any:false};
 const base={today:{sent:1243,failed:79},queue:{pending:86,retrying:3,processing:5},failedTotal:89,active:1,days:DAYS,attn:ATTN,recent:RECENT,any:true};
 if(st==='good')return{...base,today:{sent:1243,failed:0},failedTotal:0,attn:[],recent:RECENT.map(r=>r[2]==='Completed with failures'?[r[0],r[1],'Completed',r[4],r[4],0,r[6]]:r)};
 if(st==='sending')return{...base,queue:{pending:412,retrying:0,processing:5},active:1,recent:[['payouts_nov.xlsx',46,'Processing',420,1000,2,'just now'],...RECENT]};
 return base}
/* ---------- pieces ---------- */
const fmt=n=>n.toLocaleString('en');
function kpis(d){
 const inq=d.queue.pending+d.queue.retrying+d.queue.processing;
 const t=[{l:'Sent today',v:d.today.sent,c:d.any?'↑ 12% vs yesterday':'nothing sent yet',s:'ink'},{l:'Failed today',v:d.today.failed,c:d.today.failed?'needs attention':'all good',s:'bad'},{l:'In the queue',v:inq,c:inq?`${d.queue.processing} sending now · ${d.queue.retrying} retrying`:'nothing waiting'},{l:'Active Bulk Emails',v:d.active,c:d.active?(d.state==='sending'?'payouts_nov.xlsx · 42%':'orders_oct28.xlsx'):'nothing sending'}];
 if(O.kpi===5)t.push({l:'Unresolved failures',v:d.failedTotal,c:d.failedTotal?'across all Bulk Emails':'none',s:'bad'});
 return t}
function kHtml(d,cmp){const list=kpis(d);return `<div class="kgrid ${cmp?'cmp':''}" style="--n:${list.length}">${list.map(k=>`<div class="k ${k.s==='ink'?'live':''}" ${k.s==='ink'?'style="background:#161616;color:#fff"':''}><small ${k.s==='ink'?'style="color:#d9d7d0"':''}>${k.l}</small><strong ${k.s==='bad'&&k.v?'style="color:var(--bad)"':''}>${fmt(k.v)}</strong><em>${k.c}</em></div>`).join('')}</div>`}
function chart(d){
 const days=d.days.slice(-O.range);const W=640,H=190,pl=34,pb=22,iw=W-pl,ih=H-pb;
 if(!d.any)return `<div class="empty"><b>No emails sent yet</b>Send your first Bulk Email and the last ${O.range} days will show up here.<br><button class="btn sec" data-go="new">+ New Bulk Email</button></div>`;
 if(O.table)return `<div style="max-height:230px;overflow:auto"><table class="tbl"><thead><tr><th>Day</th><th>Sent</th><th>Failed</th></tr></thead><tbody>${days.slice().reverse().map(x=>`<tr><td>${x.date.toLocaleDateString('en',{day:'numeric',month:'short'})}</td><td>${fmt(x.sent)}</td><td style="color:${x.failed?'#C62E33':'inherit'}">${fmt(x.failed)}</td></tr>`).join('')}</tbody></table></div>`;
 const max=Math.max(10,...days.map(x=>O.chart==='stacked'?x.sent+x.failed:Math.max(x.sent,x.failed)));const ticks=[0,.5,1].map(f=>Math.round(max*f));
 const bw=iw/days.length;let g='';
 ticks.forEach(t=>{const y=ih-ih*t/max;g+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#EFEEEA"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${fmt(t)}</text>`});
 const lab=(i,x)=>{const step=days.length>20?Math.ceil(days.length/10):days.length>10?2:1;return i%step===0?`<text x="${x}" y="${H-6}" text-anchor="middle">${days[i].date.getDate()}</text>`:''};
 if(O.chart==='stacked'){days.forEach((x,i)=>{const bx=pl+i*bw+bw*.15,w=bw*.7,hs=ih*x.sent/max,hf=ih*x.failed/max;g+=`<rect x="${bx}" y="${ih-hs}" width="${w}" height="${hs}" rx="${Math.min(4,w/3)}" fill="#1F9D63"/>`;if(hf>0)g+=`<rect x="${bx}" y="${ih-hs-hf-1}" width="${w}" height="${hf}" rx="${Math.min(3,w/3)}" fill="#E5484D"/>`;g+=lab(i,bx+w/2)+`<rect class="hit" x="${pl+i*bw}" y="0" width="${bw}" height="${ih}"><title>${x.date.toLocaleDateString('en',{day:'numeric',month:'short'})}: ${fmt(x.sent)} sent, ${fmt(x.failed)} failed</title></rect>`})}
 else if(O.chart==='grouped'){days.forEach((x,i)=>{const w=bw*.36,bx=pl+i*bw+bw*.1,hs=ih*x.sent/max,hf=ih*x.failed/max;g+=`<rect x="${bx}" y="${ih-hs}" width="${w}" height="${hs}" rx="${Math.min(3,w/3)}" fill="#1F9D63"/><rect x="${bx+w+1}" y="${ih-hf}" width="${w}" height="${hf}" rx="${Math.min(3,w/3)}" fill="#E5484D"/>`+lab(i,bx+w)+`<rect class="hit" x="${pl+i*bw}" y="0" width="${bw}" height="${ih}"><title>${x.date.toLocaleDateString('en',{day:'numeric',month:'short'})}: ${fmt(x.sent)} sent, ${fmt(x.failed)} failed</title></rect>`})}
 else{const pt=(v,i)=>`${pl+i*bw+bw/2},${ih-ih*v/max}`;const sp=days.map((x,i)=>pt(x.sent,i)).join(' '),fp=days.map((x,i)=>pt(x.failed,i)).join(' ');g+=`<polygon points="${pl+bw/2},${ih} ${sp} ${pl+(days.length-1)*bw+bw/2},${ih}" fill="rgba(31,157,99,.14)"/><polyline points="${sp}" fill="none" stroke="#1F9D63" stroke-width="2.5" stroke-linejoin="round"/><polyline points="${fp}" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linejoin="round"/>`;days.forEach((x,i)=>{g+=lab(i,pl+i*bw+bw/2)+`<rect class="hit" x="${pl+i*bw}" y="0" width="${bw}" height="${ih}"><title>${x.date.toLocaleDateString('en',{day:'numeric',month:'short'})}: ${fmt(x.sent)} sent, ${fmt(x.failed)} failed</title></rect>`})}
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Emails sent and failed per day, last ${O.range} days">${g}</svg>`}
const legend=`<div class="legend"><span><i style="background:#1F9D63"></i>Sent</span><span><i style="background:#E5484D"></i>Failed</span></div>`;
function rangeSeg(){return O.ranges?`<div class="seg" role="group" aria-label="Range">${[7,14,30].map(n=>`<button data-r="${n}" class="${O.range===n?'on':''}">${n} days</button>`).join('')}</div>`:''}
function chartTile(d,cls,title){return `<section class="t ${cls}"><h2>${title||'Last '+O.range+' days'}<span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${legend}${rangeSeg()}<button class="ghost" id="tbl">${O.table?'Show chart':'Show as table'}</button></span></h2><div class="chart">${chart(d)}</div><div class="foot"><span>Times use your time zone (Asia/Dhaka)</span><span>Updates every few seconds</span></div></section>`}
function attnItems(d){return d.attn.map(a=>({...a,text:a.reason==='failed_jobs'?`${a.failed} failed ${a.failed===1?'email':'emails'}`:`${Math.round(100*a.invalid/a.total)}% of rows were invalid`}))}
function attnTile(d,cls){const it=attnItems(d);return `<section class="t c-attn ${cls}" style="background:#FFE9C7"><h2 style="color:#4A3410">Needs attention${it.length?`<span style="font:600 12px system-ui;background:#fff;border-radius:99px;padding:3px 10px">${it.length}</span>`:''}</h2>${it.length?`<ul class="att">${it.map(a=>`<li><div><b>${esc(a.filename)}</b><small>${a.text}</small></div><button class="sm" data-go="detail">Review</button></li>`).join('')}</ul>`:`<div class="good"><i>✓</i>Nothing needs attention</div>`}</section>`}
function attnCards(d){const it=attnItems(d);if(!it.length)return `<section class="t c-attn s12" style="background:#E4F5EC"><div class="good"><i>✓</i>All good. Nothing needs attention right now.</div></section>`;
 return `<section class="t c-attn s12" style="background:#FFE9C7"><h2 style="color:#4A3410">Needs attention <span style="font:600 12px system-ui;background:#fff;border-radius:99px;padding:3px 10px">${it.length}</span></h2><div class="acards">${it.map(a=>`<div class="acard"><b>${esc(a.filename)}</b><p>${a.text}${a.reason==='failed_jobs'?'. They can be retried.':'. Check the file and upload a corrected one.'}</p><div class="acts">${a.reason==='failed_jobs'?`<button class="sm" data-go="retry">↻ Retry</button>`:''}<button class="ghost" data-go="detail">Open</button></div></div>`).join('')}</div></section>`}
function recentRows(d,n){return d.recent.slice(0,n).map(r=>{const pct=r[4]?Math.round(100*r[3]/r[4]):0;return `<tr class="clk" data-go="detail"><td class="nm">${r[0]}<small>#${r[1]}</small></td><td>${ST[r[2]]}</td><td><div class="bar"><span style="width:${pct}%"></span></div><small>${fmt(r[3])} / ${fmt(r[4])}</small></td><td class="num">${r[5]}</td><td class="mut">${r[6]}</td></tr>`}).join('')}
function recentTile(d,cls){return `<section class="t ${cls}"><h2>Recent Bulk Emails <a href="#" data-go="list" style="color:var(--mu);font-size:13px;font-weight:600">View all</a></h2>${d.recent.length?`<table><thead><tr><th>Filename</th><th>Status</th><th>Progress</th><th class="num">Failed</th><th>When</th></tr></thead><tbody>${recentRows(d,O.rows)}</tbody></table>`:`<div class="empty"><b>No Bulk Emails yet</b>Upload a spreadsheet to send your first one.<br><button class="btn sec" data-go="new">+ New Bulk Email</button></div>`}</section>`}
function recentCompact(d,cls){return `<section class="t ${cls}"><h2>Recent Bulk Emails <a href="#" data-go="list" style="color:var(--mu);font-size:13px;font-weight:600">View all</a></h2>${d.recent.length?`<table><tbody>${d.recent.slice(0,O.rows).map(r=>`<tr class="clk" data-go="detail"><td class="nm" style="padding:11px 4px">${r[0]}<small>${r[6]}</small></td><td style="padding:11px 4px;text-align:right">${ST[r[2]]}</td></tr>`).join('')}</tbody></table>`:`<div class="empty"><b>No Bulk Emails yet</b>Upload a spreadsheet to send your first one.</div>`}</section>`}
function heroTile(d){return `<section class="t s12"><div class="hero"><div class="big"><small>Sent today</small><strong>${fmt(d.today.sent)}</strong><em>${d.today.failed?`<span style="color:var(--bad-ink,#C62E33);font-weight:600">${d.today.failed} failed</span> · `:''}${d.any?'↑ 12% vs yesterday':'nothing sent yet'}</em></div><div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><h2 style="font-size:18px;font-weight:700;letter-spacing:-.01em">Last ${O.range} days</h2><span style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${legend}${rangeSeg()}<button class="ghost" id="tbl">${O.table?'Show chart':'Show as table'}</button></span></div><div class="chart">${chart(d)}</div></div></div></section>`}
function header(){return `<div class="hdr"><div><h1>Dashboard</h1><p style="color:var(--mu);font-size:14px;margin-top:4px">Monday, 2 November · Asia/Dhaka</p></div>${O.actions?`<div class="acts"><button class="btn alt" data-go="single" style="border-radius:99px;padding:12px 18px;font-weight:600;font-size:14px;background:#fff">Single Email</button><button class="btn" data-go="new" style="background:#161616;color:#fff;border-radius:99px;padding:13px 22px;font-weight:600;font-size:14px">+ New Bulk Email</button></div>`:''}</div>`}
function page(){
 const d=data();d.state=O.state;let h=header();
 if(O.layout==='A')h+=kHtml(d)+`<div class="row12">${chartTile(d,'s8')}${attnTile(d,'s4')}</div><div class="row12">${recentTile(d,'s12')}</div>`;
 else if(O.layout==='B')h+=`<div class="row12" style="margin-top:0">${heroTile(d)}</div><div style="margin-top:14px">${kHtml({...d},true).replace('kgrid cmp','kgrid cmp')}</div><div class="row12">${attnTile(d,'s5')}${recentCompact(d,'s7')}</div>`;
 else h+=attnCards(d)+`<div style="margin-top:14px">${kHtml(d,true)}</div><div class="row12">${chartTile(d,'s7')}${recentCompact(d,'s5')}</div>`;
 return h}
function dock(){const b=(k,v,l)=>`<button data-o="${k}" data-v="${v}" aria-pressed="${String(O[k])===String(v)}">${l}</button>`;const t=(k,l)=>`<button data-t="${k}" aria-pressed="${O[k]}">${l}: ${O[k]?'on':'off'}</button>`;
 $('#dock').innerHTML=`<div class="g"><span>Layout</span>${b('layout','A','A · Classic')}${b('layout','B','B · Chart first')}${b('layout','C','C · Action first')}</div><div class="g"><span>Chart</span>${b('chart','stacked','Stacked bars')}${b('chart','grouped','Side by side')}${b('chart','line','Line')}</div><div class="g"><span>Tiles</span>${b('kpi',4,'4 tiles')}${b('kpi',5,'5 tiles')}${t('ranges','7/14/30 days switch')}${t('actions','Header buttons')}${b('rows',5,'5 recent')}${b('rows',8,'8 recent')}</div><div class="g"><span>Show state</span>${b('state','normal','Normal')}${b('state','sending','Sending now')}${b('state','good','All good')}${b('state','empty','Brand new')}</div>`;
 $$('[data-o]').forEach(x=>x.onclick=()=>{const k=x.dataset.o;O[k]=/^\d+$/.test(x.dataset.v)?+x.dataset.v:x.dataset.v;render()});$$('[data-t]').forEach(x=>x.onclick=()=>{O[x.dataset.t]=!O[x.dataset.t];render()})}
function render(){const y=scrollY;$('#main').innerHTML=page();dock();
 $$('[data-r]').forEach(b=>b.onclick=()=>{O.range=+b.dataset.r;render()});const tb=$('#tbl');if(tb)tb.onclick=()=>{O.table=!O.table;render()};
 $$('[data-go]').forEach(e=>e.onclick=ev=>{ev.preventDefault();toast({detail:'Preview only: opens the Bulk Email page',retry:'Preview only: asks "Retry N failed emails?" first',new:'Preview only: opens New Bulk Email',single:'Preview only: opens Single Email',list:'Preview only: opens the Bulk Emails list'}[e.dataset.go])});scrollTo(0,y)}
setMode('open');render();
</script></body></html>
