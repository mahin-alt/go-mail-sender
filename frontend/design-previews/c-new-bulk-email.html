function secUpload(){

 else{body=`<div class="file"><div class="ic">XLSX</div><div><b>${esc(S.file.name)}</b><small>${S.file.size}</small></div>${S.phase==='checking'?'':'<button class="x" id="rm">Remove</button>'}</div>`;

 <div><div class="mail"><div class="top"><span>Preview for recipient ${S.pi+1} of ${SAMPLES.length}</span><div><button id="pp" aria-label="Previous recipient">‹</button><button id="pn" aria-label="Next recipient">›</button></div></div><div class="to" id="pto"></div><div class="subj" id="psub"></div><div class="msg" id="pmsg"></div></div></div></div>`}

function bindWrite(){

 $$('[data-ins]').forEach(c=>c.onclick=()=>{const el=last;const a=el.selectionStart??el.value.length;el.value=el.value.slice(0,a)+c.dataset.ins+el.value.slice(el.selectionEnd??a);el.focus();el.selectionStart=el.selectionEnd=a+c.dataset.ins.length;refresh()});

function takeFile(name,size,bytes){S.err='';if(!/\.xlsx$/i.test(name)){S.err='only .xlsx files are supported';render();return}if(bytes>10*1048576){S.err='file is too large (limit 10 MB)';render();return}

function bindReview(){$$('#rtabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()})}
function sendNow(){ask('Send to '+VALID+' recipients?','Each valid row will get the email. '+SKIPPED+' invalid rows are skipped. This cannot be undone.','Send '+VALID+' emails',()=>{S.sent=true;S.view='detail';S.done=false;S.p={sent:0,failed:0};render();run()})}
function run(){clearInterval(run.t);run.t=setInterval(()=>{const left=VALID-S.p.sent-S.p.failed;if(left<=0){clearInterval(run.t);S.done=true;render();toast('Sending finished','289 sent, 7 failed. Review the report below.');return}const n=Math.min(left,19);const f=(S.p.failed<7&&Math.random()<.4)?1:0;S.p.failed=Math.min(7,S.p.failed+f);S.p.sent=Math.min(289,S.p.sent+n-f);if(S.p.sent+S.p.failed>=VALID-1){S.p.sent=289-0;S.p.failed=7}render()},180)}
function wizard(){

  h+=`<div class="stack"><section class="card">${secUpload()}</section><section class="card ${ready?'':'locked'}">${secReview()}</section><section class="card ${ready?'':'locked'}">${secWrite()}</section></div>

 nav();const m=$('#main');
